name: Package NuGet

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.x'

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./Bank

    - name: Run unit tests
      run: dotnet test --logger trx --results-directory ./TestResults
      working-directory: ./Bank

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./Bank/TestResults

    - name: Analyze with SonarCloud
      uses: sonarsource/sonarcloud-github-action@v2
      with:
        projectBaseDir: ./Bank
        args: >
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.host.url=https://sonarcloud.io
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    needs: test
    runs-on: ubuntu-latest
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.x'
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build NuGet package
      run: dotnet pack Bank.Domain/Bank.Domain.csproj -c Release -o ./nuget
      working-directory: ./Bank

    - name: List generated packages
      run: ls -la ./nuget/
      working-directory: ./Bank

    - name: Configure NuGet source and API Key
      run: |
        dotnet nuget add source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --name "github" --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
        dotnet nuget setapikey ${{ secrets.GITHUB_TOKEN }} --source "github"
      working-directory: ./Bank

    - name: Publish NuGet package
      run: dotnet nuget push ./nuget/*.nupkg --source "github" --skip-duplicate
      working-directory: ./Bank
